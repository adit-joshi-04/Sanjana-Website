        function resamplePathData(pathData, segmentLength) {
            var tempPath = new Path(pathData);
            var resampled = new Path();
            for(var i = 0; i < tempPath.length; i += segmentLength) {
                resampled.add(tempPath.getPointAt(i));
            }
            resampled.add(tempPath.getPointAt(tempPath.length));
            var newData = resampled.pathData;
            tempPath.remove();
            resampled.remove();
            return newData;
        }

        function easeInOut(t) {

    function Flower(stemData, headGroup, position, stemColor, stemWidth, leaves) {
        this.angle = 0;
        this.velocity = 0;
        this.headGroup = headGroup;
        
        // --- UPDATED: Handle Array of Leaves ---
        // We convert single leaf to array if necessary to support legacy calls
        this.leaves = [];
        var inputLeaves = [];
        if (leaves) {
            inputLeaves = Array.isArray(leaves) ? leaves : [leaves];
        }

        this.growPhase = 'done'; 
        this.growTime = 0; 
        
        this.stemPath = new Path(stemData);
        this.stemPath.strokeColor = stemColor;
        this.stemPath.strokeWidth = stemWidth;
        this.stemPath.strokeCap = 'round';
        
        // Auto-reverse check
        var first = this.stemPath.firstSegment.point;
        var last = this.stemPath.lastSegment.point;
        if (first.y < last.y) { this.stemPath.reverse(); }

        this.maxStemLength = this.stemPath.length;
        this.stemPath.dashArray = [this.maxStemLength, this.maxStemLength];
        this.stemPath.dashOffset = 0;

        this.rootPoint = this.stemPath.firstSegment.point.clone();
        this.stemSegments = [];
        for (var i = 0; i < this.stemPath.segments.length; i++) {
            var segment = this.stemPath.segments[i];
            this.stemSegments.push({
                point: segment.point.subtract(this.rootPoint),
                handleIn: segment.handleIn.clone(),
                handleOut: segment.handleOut.clone()
            });
        }

        var tipIndex = this.stemPath.segments.length - 1;
        var initialTip = this.stemPath.segments[tipIndex].point;
        this.headOffset = this.headGroup.position.subtract(initialTip);

        // --- LEAF ATTACHMENT LOGIC ---
        // For each leaf, find the closest stem segment and calculate offsets
        for (var k = 0; k < inputLeaves.length; k++) {
            var leaf = inputLeaves[k];
            
            // 1. Find best segment based on Leaf PIVOT (or center if pivot not set)
            var leafRefY = leaf.pivot ? leaf.pivot.y : leaf.position.y;
            
            var bestDist = 99999;
            var bestIndex = 0;
            
            for(var i=0; i<this.stemPath.segments.length; i++) {
                var segPoint = this.stemPath.segments[i].point;
                var dist = Math.abs(segPoint.y - leafRefY);
                if(dist < bestDist) {
                    bestDist = dist;
                    bestIndex = i;
                }
            }
            
            // 2. Adjust leaf pivot to match the stem segment exactly
            // This snaps the leaf to the stem if it wasn't perfectly aligned in SVG
            var stemPoint = this.stemPath.segments[bestIndex].point;
            var snapVector = stemPoint.subtract(leaf.pivot || leaf.position);
            leaf.position = leaf.position.add(snapVector);
            if(leaf.pivot) leaf.pivot = leaf.pivot.add(snapVector);

            // 3. Store configuration
            // We save the vector from the pivot (on stem) to the leaf center
            var pivotToCenter = leaf.position.subtract(leaf.pivot || leaf.position);
            
            this.leaves.push({
                group: leaf,
                index: bestIndex,
                offsetVector: pivotToCenter
            });
        }

        // Group items
        var items = [this.stemPath, this.headGroup];
        for(var k=0; k<this.leaves.length; k++) {
            items.push(this.leaves[k].group);
        }

        this.fullGroup = new Group(items);
        this.fullGroup.position = position;
        this.rootPoint = this.stemPath.firstSegment.point; 
    }

    Flower.prototype.startGrow = function() {
        this.growPhase = 'stem';
        this.growTime = 0; 
        this.stemPath.dashOffset = this.maxStemLength;
        this.headGroup.opacity = 0;
        this.headGroup.scale(0.001);
        
        // Hide all leaves
        for(var i=0; i<this.leaves.length; i++) {
            this.leaves[i].group.opacity = 0;
            this.leaves[i].group.scale(0.001);
        }
        this.currentScale = 0.001; 
    };

    Flower.prototype.update = function(mousePoint, mouseDeltaX) {
        if (mousePoint && mousePoint.getDistance(this.headGroup.position) < 100) {
            this.velocity += mouseDeltaX * windForce;
        }
        var acceleration = -this.angle * spring;
        this.velocity += acceleration;
        this.velocity *= friction;
        this.angle += this.velocity;

        // Animation
        if (this.growPhase === 'stem') {
            this.growTime += 0.015; 
            if (this.growTime >= 1) {
                this.growTime = 1;
                this.stemPath.dashOffset = 0;
                this.growPhase = 'head';
                this.growTime = 0; 
            } else {
                var t = easeInOut(this.growTime);
                this.stemPath.dashOffset = this.maxStemLength * (1 - t);
            }
        }
        else if (this.growPhase === 'head') {
            this.growTime += 0.02; 
            if (this.growTime >= 1) {
                this.growTime = 1;
                this.growPhase = 'done';
            }
            var t = easeInOut(this.growTime);
            this.headGroup.opacity = t;
            
            var desiredScale = t;
            if (this.currentScale < 0.0001) this.currentScale = 0.0001;
            var scaleFactor = desiredScale / this.currentScale;
            
            this.headGroup.scale(scaleFactor);
            
            // Scale all leaves
            for(var i=0; i<this.leaves.length; i++) {
                this.leaves[i].group.opacity = t;
                this.leaves[i].group.scale(scaleFactor);
            }
            this.currentScale = desiredScale;
        }

        // Stem Physics
        for (var i = 0; i < this.stemPath.segments.length; i++) {
            var original = this.stemSegments[i];
            var factor = i / (this.stemPath.segments.length - 1);
            var currentAngle = this.angle * factor;
            var newPos = original.point.rotate(currentAngle);
            this.stemPath.segments[i].point = this.rootPoint.add(newPos);
        }
        this.stemPath.smooth({ type: 'continuous' });

        // Head Position
        var tipSegment = this.stemPath.lastSegment;
        var rotatedHeadOffset = this.headOffset.rotate(this.angle);
        this.headGroup.position = tipSegment.point.add(rotatedHeadOffset);
        this.headGroup.rotation = this.angle * 0.01; 
        
        // --- UPDATE LEAVES ---
        for(var k=0; k<this.leaves.length; k++) {
            var leafConfig = this.leaves[k];
            
            // 1. Get current position of attachment segment
            var leafSeg = this.stemPath.segments[leafConfig.index];
            
            // 2. Calculate partial angle (lower leaves swing less)
            var factor = leafConfig.index / (this.stemPath.segments.length - 1);
            var leafAngle = this.angle * factor * 0.5;
            
            // 3. Rotate the offset vector
            var rotatedOffset = leafConfig.offsetVector.rotate(leafAngle);
            
            // 4. Update Leaf Group
            leafConfig.group.position = leafSeg.point.add(rotatedOffset);
            leafConfig.group.rotation = leafAngle;
        }
    };

    <script>
        const beePlayer = document.getElementById('lt-bee');

        // 1. Handle Click
        beePlayer.addEventListener('click', () => {
            const anim = beePlayer.getLottie();

            // RESET: Ensure we aren't looping the small segment anymore
            // and start from the beginning of the whole file.
            beePlayer.loop = false; 
            anim.loop = false;
            
            beePlayer.stop();
            beePlayer.play();
        });

        // 2. Handle Completion (End of the first full play)
        beePlayer.addEventListener('complete', () => {
            const anim = beePlayer.getLottie();
            
            // Calculate the last 0.5 seconds
            // (Total Frames) - (Frame Rate * 0.5)
            const startFrame = Math.max(0, anim.totalFrames - (anim.frameRate * 0.53));
            
            // Enable looping on the internal animation instance
            anim.loop = true;

            // Force it to play ONLY this segment loop
            anim.playSegments([startFrame, anim.totalFrames], true);
        });
    </script>

    <script>
        // 1. List of IDs you want to activate behind the canvas
        const cssTargets = ['white-wheel', 'white-wheel-2', 'yellow-head'];
        const lottieTargets = ['lt-circles-circle', 'lt-circles-circle-2', 'blue-w-white-dot', 'lt-rotate-circle2', 'blue-head'];

        // 2. Global Mouse Tracker
        document.addEventListener('mousemove', (e) => {
            
            // Get ALL elements under the mouse cursor (returns an array)
            // This includes the Canvas, the Body, AND the elements behind the canvas
            const elementsUnderCursor = document.elementsFromPoint(e.clientX, e.clientY);

            // --- Handle CSS Animation Wheels ---
            cssTargets.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;

                // Check if this element is in the stack under the mouse
                if (elementsUnderCursor.includes(el)) {
                    el.classList.add('force-spin'); // Add class to spin
                } else {
                    el.classList.remove('force-spin'); // Remove class to pause
                }
            });

            // --- Handle Lottie Players ---
            lottieTargets.forEach(id => {
                const player = document.getElementById(id);
                if (!player) return;

                // Check if player is under mouse
                const isHovering = elementsUnderCursor.includes(player);
                
                // Logic: If hovering and paused, play. If not hovering and playing, pause.
                if (isHovering && player.getLottie().isPaused) {
                    player.play();
                } else if (!isHovering && !player.getLottie().isPaused) {
                    player.pause(); 
                }
            });
        });
    </script>
