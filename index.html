<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- RESET & BASIC SETUP --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #213e29;
        }

        /* --- THE VIEWPORT (Window) --- */
        #stage-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center; 
            align-items: center;     
        }

        /* --- THE STAGE (1680x880 Source of Truth) --- */
        #stage {
            position: absolute;
            width: 1680px; 
            height: 880px;
            /* transform-origin: top left;  */
            background-color: #213e29; 
            overflow: hidden;
            /* Force hardware acceleration for smooth scaling */
            will-change: transform;
        }

        #wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* --- LAYERS --- */
        .lottie-layer {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        .canvas-layer {
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
            width: 100%; height: 100%;
        }

        .no-anim, img, svg {
            position: absolute;
            pointer-events: none;
        }

        /* --- POSITIONING (Original percentages preserved) --- */
        #lt-jumping-star { top: 93%; left: 80%; transform: translate(-50%, -50%); }
        #lt-rotate-circle { top: 40%; left: 87%; transform: translate(-50%, -50%); }
        #lt-rotate-circle2 { top: 90%; left: 55%; transform: translate(-50%, -50%); }
        #lt-bee { top: 49%; left: 9%; transform: translate(-50%, -50%); }
        #lt-circles-circle { left: 1%; top: 2%; }
        #lt-circles-circle-2 { left: 90%; top: 14%; }

        #blue-head { position: absolute; bottom: -180px; left: 4%; scale: 0.8; z-index: 3; }
        
        #yellow-head {
            position: absolute; bottom: 7%; right: 20%;
            transform: translateX(-50%) translateY(50%);
            animation: spin 20s linear infinite; animation-play-state: paused;
        }

        #white-wheel {
            position: absolute; top: 20%; left: 52%;
            transform: translateX(-50%);
            animation: spin 25s linear infinite; animation-play-state: paused;
        }

        #white-wheel-2 {
            position: absolute; width: 9%; height: auto; bottom: 10%; left: 88%;
            transform: translateX(-50%);
            animation: spin 25s linear infinite; animation-play-state: paused;
        }

        .force-spin { animation-play-state: running !important; }

        #blue-bent { left: 14.5%; bottom: -15%; z-index: 3; height: auto; width: auto;}
        #blue-upright { left: 47%; bottom: 0%; height: 64%; width: auto; z-index: 3; }
        #white-ball-1 { left: 80%; bottom: -28%; }
        #white-ball-2 { left: 53%; bottom: -35%; }
        #white-ball-3 { left: 4%; bottom: -22%; }
        #white-ball-4 { left: 1%; bottom: -50%; }
        #outline-balls { left: 17%; bottom: 0%; }
        #blue-w-white-dot { left: 65%; bottom: -4%; }

        /* Stars */
        .stars { position: absolute; display: block; transform-box: fill-box; transform-origin: center; }
        #star-1 { left: 12%; top: 8%; width: 65px; fill: #ffc562; }
        #star-2 { left: 37%; top: 13%; width: 35px; fill: #e293d9; }
        #star-3 { left: 57%; top: -2%; width: 65px; fill: #e293d9; }
        #star-4 { left: 13%; top: 75%; width: 38px; fill: #e293d9; }
        #star-5 { left: 39%; top: 68%; width: 31px; fill: #e293d9; }
        #star-6 { left: 50%; top: 43%; width: 41px; fill: #e293d9; }
        #star-7 { left: 80%; top: 47%; width: 35px; fill: #e293d9; }
        #star-8 { left: 78%; top: -4%; width: 35px; fill: #00cf5e; }
        #twinkle-star-1 { left: 85%; top: 8%; }
        #twinkle-star-2 { left: 20%; top: 48%; width: 60px; fill: #00cf5e; }
        #twinkle-star-3 { left: 45%; top: 85%; width: 70px; }

        /* Dots */
        .random-dot {
            position: absolute; width: 12px; height: 12px;
            border-radius: 50%; z-index: 1; pointer-events: none;
        }
        #dot-1 {left: 15%; top: 5%; background-color: #de604b;}
        #dot-2 {left: 41%; top: 9%; background-color: #de604b;}
        #dot-3 {left: 58%; top: 27%; background-color: #ffc562;}
        #dot-4 {left: 88%; top: 92%; background-color: #ffc562;}
        #dot-5 {left: 97%; top: 50%; background-color: #ffc562;}
        #dot-6 {left: 83%; top: 21%; background-color: #ffc562;}

        .big-dot {
            position: absolute; width: 32px; height: 32px;
            border-radius: 50%; z-index: 1; pointer-events: none;
            background-color: #ef5542; left: 96%; bottom: 3%;
            transform: translateX(-50%) translateY(50%);
        }

        /* --- INTERACTIVITY FIX --- */
        /* Re-enable mouse events for the specific interactive elements */
        #lt-bee, 
        #white-wheel, 
        #white-wheel-2, 
        #yellow-head,
        #lt-circles-circle, 
        #lt-circles-circle-2, 
        #blue-w-white-dot, 
        #lt-rotate-circle2, 
        #blue-head {
            pointer-events: auto !important;
            
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        function resizeStage() {
            const stage = document.getElementById('stage');
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const baseW = 1680;
            const baseH = 880;
            
            // Strictly check for Mobile Portrait mode
            const isMobile = winW < winH; 

            if (isMobile) {
                // --- MOBILE MODE: Pin Top-Left ---
                // We anchor to the top-left corner so the left side is always visible (0,0)
                // and the right side gets cropped.
                
                const scale = winH / baseH;
                
                // Calculate vertical centering manually since we are pinned top-left
                const topOffset = (winH - (baseH * scale)) / 2;

                // Apply Styles
                stage.style.transformOrigin = 'top left';
                stage.style.left = '0px';
                stage.style.top = '0px';
                
                // Translate moves it down to center vertically, then we Scale
                stage.style.transform = `translate3d(0px, ${topOffset}px, 0) scale(${scale})`;
                
            } else {
                // --- DESKTOP MODE: Pin Center-Center ---
                // We anchor to the center. This fixes the "Drift" when zooming.
                // CSS handles the positioning (50% 50%), JS handles the scaling.
                
                // Calculate scale to "Contain" (Fit screen without cropping)
                const scaleX = winW / baseW;
                const scaleY = winH / baseH;
                const scale = Math.min(scaleX, scaleY);

                // Apply Styles
                stage.style.transformOrigin = 'center center';
                stage.style.left = '50%';
                stage.style.top = '50%';
                
                // We use -50% translate to pull the element back to the true center
                // This is the standard CSS way to center absolute elements
                stage.style.transform = `translate3d(-50%, -50%, 0) scale(${scale})`;
            }
        }

        window.addEventListener('load', resizeStage);
        window.addEventListener('resize', resizeStage);
    </script>

    <script>
        const beePlayer = document.getElementById('lt-bee');
        if(beePlayer) {
            beePlayer.addEventListener('click', () => {
                const anim = beePlayer.getLottie();
                beePlayer.loop = false; 
                anim.loop = false;
                beePlayer.stop();
                beePlayer.play();
            });
            beePlayer.addEventListener('complete', () => {
                const anim = beePlayer.getLottie();
                const startFrame = Math.max(0, anim.totalFrames - (anim.frameRate * 0.53));
                anim.loop = true;
                anim.playSegments([startFrame, anim.totalFrames], true);
            });
        }

        const cssTargets = ['white-wheel', 'white-wheel-2', 'yellow-head'];
        const lottieTargets = ['lt-circles-circle', 'lt-circles-circle-2', 'blue-w-white-dot', 'lt-rotate-circle2', 'blue-head'];

        document.addEventListener('mousemove', (e) => {
            const elementsUnderCursor = document.elementsFromPoint(e.clientX, e.clientY);
            
            cssTargets.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                if (elementsUnderCursor.includes(el)) {
                    el.classList.add('force-spin'); 
                } else {
                    el.classList.remove('force-spin'); 
                }
            });

            lottieTargets.forEach(id => {
                const player = document.getElementById(id);
                if (!player) return;
                const isHovering = elementsUnderCursor.includes(player);
                if (isHovering && player.getLottie() && player.getLottie().isPaused) {
                    player.play();
                } else if (!isHovering && player.getLottie() && !player.getLottie().isPaused) {
                    player.pause(); 
                }
            });
        });
    </script>
